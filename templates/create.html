<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Campaign - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-8 font-sans flex justify-center items-center">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 p-6 rounded-xl shadow-xl">
        <h1 class="text-xl font-bold mb-4">Create New Campaign</h1>
        <form id="create-form" onsubmit="createCampaign(event)" class="space-y-3">
            <div>
                <label class="text-xs text-slate-400">NGO Name</label>
                <input type="text" id="ngo_name" required class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-sm text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-slate-400">Campaign Title</label>
                <input type="text" id="title" required class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-sm text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-slate-400">Target Amount ($)</label>
                <input type="number" id="target_amount" required class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-sm text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-slate-400">Vendor Name</label>
                <input type="text" id="vendor_name" required class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-sm text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-slate-400">Initial Milestone Title</label>
                <input type="text" id="milestone_title" required class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-sm text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-slate-400">Milestone Target Amount ($)</label>
                <input type="number" id="milestone_target" required class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-sm text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
            <div class="flex gap-2 pt-2">
                <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-500 font-bold py-2 rounded text-sm transition-all">Create</button>
                <a href="/" class="bg-slate-800 hover:bg-slate-700 font-semibold px-4 py-2 rounded text-sm flex items-center text-slate-300 transition-all">Cancel</a>
            </div>
        </form>
    </div>
    <script>
        async function createCampaign(e) {
            e.preventDefault();
            const data = {
                ngo_name: document.getElementById('ngo_name').value,
                title: document.getElementById('title').value,
                target_amount: document.getElementById('target_amount').value,
                vendor_name: document.getElementById('vendor_name').value,
                milestone_title: document.getElementById('milestone_title').value,
                milestone_target: document.getElementById('milestone_target').value
            };
            const res = await fetch('/api/create-campaign', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if (res.ok) window.location.href = '/';
            else {
                const err = await res.json();
                alert(err.error || "Failed to create campaign.");
            }
        }
    </script>
</body>
</html>
