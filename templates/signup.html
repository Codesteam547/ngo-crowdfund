<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Account - Escrow Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent">Create Account</h1>
            <p class="text-xs text-slate-400 mt-1">Join as a Donor or Platform Admin</p>
        </div>

        <div id="error-alert" class="bg-red-950/80 border border-red-800 text-red-300 text-xs p-3 rounded-lg mb-4 hidden"></div>

        <form onsubmit="handleSignup(event)" class="space-y-4">
            <div>
                <label class="text-xs text-slate-400 block mb-1 font-semibold uppercase">Username</label>
                <input type="text" id="username" required placeholder="Choose a username" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1 font-semibold uppercase">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-slate-100 focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="text-xs text-slate-400 block mb-1 font-semibold uppercase">Account Role</label>
                <select id="role" class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-slate-100 focus:outline-none focus:border-blue-500">
                    <option value="donor">Donor (Can deposit funds & view receipts)</option>
                    <option value="admin">Admin (Can release escrow & manage campaigns)</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 font-bold py-3 rounded-xl text-sm transition-all shadow-lg shadow-blue-600/20">Register</button>
        </form>

        <p class="text-xs text-slate-400 text-center mt-6">
            Already have an account? <a href="/login" class="text-blue-400 font-semibold underline">Sign In</a>
        </p>
        <p class="text-xs text-slate-500 text-center mt-2">
            <a href="/" class="hover:text-slate-300">← Back to Dashboard</a>
        </p>
    </div>

    <script>
        async function handleSignup(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const alertBox = document.getElementById('error-alert');

            alertBox.classList.add('hidden');

            const res = await fetch('/api/signup', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ username, password, role })
            });

            const data = await res.json();

            if (res.ok) {
                window.location.href = '/';
            } else {
                alertBox.innerText = data.error || "Signup failed.";
                alertBox.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
